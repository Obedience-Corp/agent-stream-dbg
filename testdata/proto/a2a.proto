// Test service for the gRPC transport's A2A cross-transport parity test
// (dialects/cross_transport_test.go's TestA2ADialect_CrossTransportParity)
// — the gRPC equivalent of testdata/fixtures/a2a-session.jsonl for SSE.
//
// Vendored from the real A2A (Agent2Agent) protocol's normative proto —
// https://github.com/a2aproject/A2A/blob/main/specification/a2a.proto
// (Apache License 2.0: https://github.com/a2aproject/A2A/blob/main/LICENSE)
// — fetched fresh 2026-07-15, matching the same commit dialects/a2a.yaml's
// own header comment verified its field names/enum strings against. Every
// field number, field name, and enum value kept below is copied verbatim
// from that source; nothing is invented. Line numbers in the comments on
// each message refer to that source file as fetched on 2026-07-15.
//
// Trimmed, deliberately, to only what this one parity test needs — not an
// approximation of the fields that ARE kept, only a subset of which
// fields/oneof branches are present at all:
//
//   - StreamResponse's oneof (a2a.proto:790-802) keeps its real task=1,
//     status_update=3, artifact_update=4 field numbers and names, but
//     drops the real message=2 branch (type Message) entirely: this
//     test's two sub-cases are statusUpdate and artifactUpdate (mirroring
//     dialects/cross_transport_test.go's TestBrainyardDialect_CrossTransportParity's
//     two sub-cases) — a2a.yaml's `message` rule is already proven over
//     SSE by dialects/dialects_test.go's TestA2ADialect_ExactDecode; this
//     file's job is the gRPC transport seam, not re-proving every dialect
//     rule a second time. Message itself is therefore not vendored here,
//     and Task.history (repeated Message, a2a.proto:180) and
//     TaskStatus.message (Message, a2a.proto:215) — both real fields —
//     are dropped for the same reason.
//   - Task, TaskStatusUpdateEvent, TaskArtifactUpdateEvent, TaskStatus,
//     Artifact, and Part each keep every field dialects/a2a.yaml's rules
//     actually read (see that file's per-rule comments) plus the
//     surrounding fields needed for a structurally faithful message, and
//     drop the rest. Notably dropped throughout: every message's
//     `metadata` field (google.protobuf.Struct) and TaskStatus's
//     `timestamp` (google.protobuf.Timestamp) — real fields on the real
//     messages, but pulling in google/protobuf/struct.proto and
//     timestamp.proto imports for fields no rule in a2a.yaml reads is
//     unjustified complexity for this test's scope (a legitimate choice
//     the task explicitly leaves open either way). Part's oneof keeps
//     only its `text` member (a2a.yaml's artifactUpdate rule extracts
//     parts.0.text specifically; raw/url/data are unmapped in the
//     dialect itself, per its own comment, so there is nothing for a
//     parity test to exercise on those branches).
//   - The google.api.field_behavior REQUIRED annotations on the real
//     proto's fields are represented here only as "// REQUIRED" text
//     comments (matching the real proto's own doc comments), not the
//     actual (google.api.field_behavior) option — that avoids importing
//     google/api/field_behavior.proto for an annotation this test never
//     inspects at runtime.
//
// package is a2a.v1, not the real proto's lf.a2a.v1: this is a
// deliberately trimmed test-only vendor, not a byte-for-byte mirror of
// the upstream package, and a distinct package name avoids any
// impression that github.com/lancekrogers/stream-debugger's generated Go
// package is (or could be mistaken for) the real upstream one. The RPC
// name SendStreamingMessage and its request/response shapes are kept
// faithful to the real spec (a2a.proto:31-42) wherever vendored.
//
// A2AService itself is trimmed to this one RPC — the real service
// (a2a.proto:19-165) has 11 methods (SendMessage, GetTask, CancelTask,
// ...); only SendStreamingMessage, the RPC dialects/a2a.yaml's rules
// decode responses from, is needed to exercise the gRPC transport seam.
// Mirrors testdata/proto/agentstream.proto's own posture: a minimal
// service, not a full second real dialect.
syntax = "proto3";
package a2a.v1;

option go_package = "github.com/lancekrogers/stream-debugger/internal/testutil/mockgrpc/a2apb";

// A2AService (a2a.proto:19-165), trimmed to its one streaming RPC — see
// the file header for why the other 10 methods aren't vendored.
service A2AService {
  // SendStreamingMessage (a2a.proto:31-42): sends a streaming message to
  // an agent, allowing for real-time interaction and status updates.
  rpc SendStreamingMessage(SendMessageRequest) returns (stream StreamResponse);
}

// SendMessageRequest stands in for the real request message (a2a.proto's
// SendMessageRequest, which carries a REQUIRED `message` field of type
// Message — not vendored here, see the file header). Deliberately empty:
// this test's mock server (internal/testutil/mockgrpc's A2AServer) never
// reads request fields, only replays a scripted response sequence, so an
// empty request message is a legitimate trim rather than a shortcut that
// changes any field's real shape.
message SendMessageRequest {}

// StreamResponse (a2a.proto:790-802): a wrapper object used in streaming
// operations to encapsulate different types of response data. See the
// file header for why the real message=2 oneof branch is dropped.
message StreamResponse {
  oneof payload {
    // A Task object containing the current state of the task.
    Task task = 1;
    // An event indicating a task status update.
    TaskStatusUpdateEvent status_update = 3;
    // An event indicating a task artifact update.
    TaskArtifactUpdateEvent artifact_update = 4;
  }
}

// Task (a2a.proto:167-184): the core unit of action for A2A. history
// (repeated Message, field 5) and metadata (google.protobuf.Struct,
// field 6) are dropped — see the file header. id/context_id/status/
// artifacts keep their real field numbers and names.
message Task {
  // Unique identifier (e.g. UUID) for the task, generated by the server
  // for a new task. REQUIRED.
  string id = 1;
  // Unique identifier (e.g. UUID) for the contextual collection of
  // interactions (tasks and messages).
  string context_id = 2;
  // The current status of a Task, including state and a message.
  // REQUIRED.
  TaskStatus status = 3;
  // A set of output artifacts for a Task.
  repeated Artifact artifacts = 4;
}

// TaskState (a2a.proto:187-208): the possible lifecycle states of a
// Task. Copied verbatim, every value — dialects/a2a.yaml's rules extract
// the raw state string structurally; silently dropping a legitimate
// value would be a correctness bug for any dialect consumer downstream,
// even though this parity test's own two sub-cases only exercise
// TASK_STATE_WORKING and TASK_STATE_COMPLETED.
enum TaskState {
  // The task is in an unknown or indeterminate state.
  TASK_STATE_UNSPECIFIED = 0;
  // Indicates that a task has been successfully submitted and acknowledged.
  TASK_STATE_SUBMITTED = 1;
  // Indicates that a task is actively being processed by the agent.
  TASK_STATE_WORKING = 2;
  // Indicates that a task has finished successfully. This is a terminal state.
  TASK_STATE_COMPLETED = 3;
  // Indicates that a task has finished with an error. This is a terminal state.
  TASK_STATE_FAILED = 4;
  // Indicates that a task was canceled before completion. This is a terminal state.
  TASK_STATE_CANCELED = 5;
  // Indicates that the agent requires additional user input to proceed. This is an interrupted state.
  TASK_STATE_INPUT_REQUIRED = 6;
  // Indicates that the agent has decided to not perform the task. This is a terminal state.
  TASK_STATE_REJECTED = 7;
  // Indicates that authentication is required to proceed. This is an interrupted state.
  TASK_STATE_AUTH_REQUIRED = 8;
}

// TaskStatus (a2a.proto:211-219): a container for the status of a task.
// message (Message, field 2) and timestamp (google.protobuf.Timestamp,
// field 3) are dropped — see the file header. state keeps its real
// field number.
message TaskStatus {
  // The current state of this task. REQUIRED.
  TaskState state = 1;
}

// Part (a2a.proto:224-242): a container for a section of communication
// content. Only the `text` oneof member is vendored — see the file
// header for why raw/url/data and metadata/filename/media_type are
// dropped.
message Part {
  oneof content {
    // The string content of the text part.
    string text = 1;
  }
}

// Artifact (a2a.proto:280-293): task outputs. description (field 3),
// metadata (field 5), and extensions (field 6) are dropped — see the
// file header. artifact_id/name/parts keep their real field numbers.
message Artifact {
  // Unique identifier (e.g. UUID) for the artifact. REQUIRED.
  string artifact_id = 1;
  // A human readable name for the artifact.
  string name = 2;
  // The content of the artifact. Must contain at least one part. REQUIRED.
  repeated Part parts = 4;
}

// TaskStatusUpdateEvent (a2a.proto:296-305): an event sent by the agent
// to notify the client of a change in a task's status. metadata (field
// 4) is dropped — see the file header. task_id/context_id/status keep
// their real field numbers.
message TaskStatusUpdateEvent {
  // The ID of the task that has changed. REQUIRED.
  string task_id = 1;
  // The ID of the context that the task belongs to. REQUIRED.
  string context_id = 2;
  // The new status of the task. REQUIRED.
  TaskStatus status = 3;
}

// TaskArtifactUpdateEvent (a2a.proto:308-322): a task delta where an
// artifact has been generated. metadata (field 6) is dropped — see the
// file header. task_id/context_id/artifact/append/last_chunk keep their
// real field numbers.
message TaskArtifactUpdateEvent {
  // The ID of the task for this artifact. REQUIRED.
  string task_id = 1;
  // The ID of the context that this task belongs to. REQUIRED.
  string context_id = 2;
  // The artifact that was generated or updated. REQUIRED.
  Artifact artifact = 3;
  // If true, the content of this artifact should be appended to a
  // previously sent artifact with the same ID.
  bool append = 4;
  // If true, this is the final chunk of the artifact.
  bool last_chunk = 5;
}
