name: Release

# Same model as Obedience-Corp/festival: tag push → GoReleaser (GitHub + Homebrew)
# → npm publish. Requires secrets:
#   HOMEBREW_TAP_GITHUB_TOKEN  — write access to Obedience-Corp/homebrew-tap
#   NPM_TOKEN                  — publish @obedience-corp/agent-stream-dbg

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish to npm, without leading v (example: 0.1.0)"
        required: true
        type: string
      release_mode:
        description: "npm dist-tag channel"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - rc
          - dev

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Detect release channel
        id: release_channel
        run: |
          case "${GITHUB_REF_NAME}" in
            v*-dev.*)
              echo "mode=dev" >> "$GITHUB_OUTPUT"
              ;;
            v*-rc.*)
              echo "mode=rc" >> "$GITHUB_OUTPUT"
              ;;
            v*)
              echo "mode=stable" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unsupported tag format: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Validate stable publish credentials
        if: steps.release_channel.outputs.mode == 'stable'
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          missing=0
          for name in HOMEBREW_TAP_GITHUB_TOKEN NPM_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Test
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_MODE: ${{ steps.release_channel.outputs.mode }}
        run: scripts/publish_npm_package.sh

  npm-publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v4

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
          path: release-source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PACKAGE_DIR: release-source/npm
          NPM_PACKAGE_VERSION: ${{ inputs.version }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: scripts/publish_npm_package.sh
