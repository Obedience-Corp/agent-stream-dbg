# Generic SSE Configuration
# Template for other SSE streaming APIs

transport:
  type: "sse"
  base_url: "http://localhost:8080"

  stream_endpoint:
    url: "/api/stream"
    method: "POST"

    headers:
      Accept: "text/event-stream"
      Content-Type: "application/json"

    auth:
      type: "api_key"
      header_name: "X-API-Key"
      token_env: "API_KEY"

session:
  id: "default-session"

events:
  # Empty list means track all events
  types: []

logging:
  dir: "./logs"
  dimensions:
    by_event_type: true
    by_agent: true
    by_session: true
    api_calls: true

display:
  colors: true
  max_agents_visible: 3
